<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Práctica 2</title>
    <style>
      html,
      body {
        height: 100svh;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        padding: 8px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #111;
        font-family: Arial, sans-serif;
      }
      .game-wrapper {
        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .game-area {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        border: 2px solid #444;
        background-color: #000;
        touch-action: none;
        box-sizing: border-box; /* el borde ya se incluye en el ancho/alto fijados por JS */
      }
      #winner {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        text-align: center;
        pointer-events: none;
      }
      #winner h2 {
        margin: 0;
        font-size: clamp(1.2rem, 5vmin, 2.2rem);
      }
      #winner p {
        margin: 0;
        font-size: clamp(0.8rem, 2.5vmin, 1rem);
        opacity: 0.8;
      }

      .scoreboard {
        flex: 0 0 auto;
        display: flex;
        gap: 24px;
        margin-top: 6px;
        color: white;
        font-size: 14px;
      }
      .scoreboard .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .scoreboard .swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        display: inline-block;
      }
      .scoreboard .swatch.p1 {
        background: yellow;
      }
      .scoreboard .swatch.p2 {
        background: blue;
      }
      .scoreboard .value {
        font-weight: bold;
        font-size: 16px;
      }
      .reset-hint {
        color: #aaa;
        font-size: 12px;
        margin-top: 4px;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        body {
          padding: 4px;
        }
        .scoreboard {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-wrapper">
      <div class="game-area">
        <canvas id="my_Canvas" width="900" height="500"></canvas>
        <div id="winner">
          <h2 id="winnerText"></h2>
          <p>Pulsa R para reiniciar</p>
        </div>
      </div>
    </div>

    <div class="scoreboard">
      <div class="row">
        <span class="swatch p1"></span>
        <span>Jugador 1 (derecha, WASD):</span>
        <span class="value" id="score1">0</span>
      </div>
      <div class="row">
        <span class="swatch p2"></span>
        <span>Jugador 2 (izquierda, flechas):</span>
        <span class="value" id="score2">0</span>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
